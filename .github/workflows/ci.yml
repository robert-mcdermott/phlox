name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync --frozen --extra dev
      - name: Lint (ruff)
        run: uv run ruff check app tests
      - name: Tests (pytest + coverage)
        run: uv run pytest --cov=app --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  database-operations:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: phlox
          POSTGRES_PASSWORD: phlox-ci-test-only
          POSTGRES_DB: phlox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phlox -d phlox_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      PHLOX_TEST_POSTGRES_URL: postgresql+psycopg://phlox:phlox-ci-test-only@127.0.0.1:5432/phlox_test
      PHLOX_TEST_PG_BIN_DIR: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - name: Sync test dependencies
        run: uv sync --frozen --extra dev --extra postgres
      - name: SQLite and Postgres upgrade, failure, and restore drills
        run: uv run --frozen --extra dev --extra postgres pytest tests/test_operations.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser approval and isolation tests
        run: npm run test:browser

  container-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t phlox-ci .
      - name: Assert non-root runtime identity and writable data path
        run: |
          test "$(docker image inspect phlox-ci --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm --entrypoint sh phlox-ci -c 'test "$(id -u)" = 10001 && test "$(id -g)" = 10001 && test -w /app/backend/data && test ! -w /app/backend/app'
